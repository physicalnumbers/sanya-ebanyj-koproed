<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Публичные профили пользователей проекта «Физические Номера».">
<title>Пользователи — Физические Номера</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;scroll-behavior:smooth}
body{background:#f5f5f5;color:#111;font:14px Arial,Helvetica,sans-serif}
a{color:inherit}
.container{width:min(100% - 48px,1100px);margin:0 auto}
.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d8d8d8}
.logo{font-size:18px;font-weight:600;text-decoration:none}
.back-link{color:#555;text-decoration:none}
.back-link:hover{color:#111}
main{min-height:calc(100vh - 210px);padding:76px 0 100px}
.eyebrow{margin:0 0 24px;color:#888;font-size:12px;letter-spacing:2px;text-transform:uppercase}
h1{margin:0;font-size:clamp(44px,8vw,88px);font-weight:500;letter-spacing:-5px;line-height:.95}
.intro{max-width:610px;margin:24px 0 48px;color:#666;font-size:16px;line-height:1.65}
.status{min-height:22px;margin-bottom:20px;color:#777;line-height:1.6}
.user-list{border-top:1px solid #d0d0d0}
.user-link{position:relative;min-width:0;min-height:96px;padding:18px 44px 18px 4px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #d0d0d0;background:#f5f5f5;text-decoration:none;transition:background .2s}
.user-link::after{content:"↗";position:absolute;right:8px;top:50%;color:#999;font-size:20px;transform:translateY(-50%);transition:color .2s,transform .2s}
.user-link:hover{background:#fff}
.user-link:hover::after{color:#111;transform:translate(2px,-50%)}
.user-link:focus-visible,.more:focus-visible{outline:2px solid #111;outline-offset:3px;z-index:1}
.avatar{width:54px;height:54px;flex:0 0 54px;border-radius:50%;object-fit:cover;background:#e5e5e5;color:#555}
.avatar-placeholder{display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.user-copy{min-width:0}
.user-copy h2{margin:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.user-copy p{margin:6px 0 0;color:#777;font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.more{min-height:46px;margin-top:24px;padding:0 20px;border:1px solid #111;background:#111;color:#fff;cursor:pointer;font:14px Arial}
.more:hover{background:transparent;color:#111}
.more:disabled{opacity:.55;cursor:wait}
.hidden{display:none!important}
footer{min-height:136px;padding:34px 0;background:#111;color:#fff;display:flex;align-items:center}
.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:24px}
.footer-title{font-size:20px}
.copy{color:#888}
@media(max-width:700px){.container{width:calc(100% - 32px)}main{padding:55px 0 70px}h1{letter-spacing:-3px}.intro{margin:20px 0 34px}.user-link{min-height:84px;padding:14px 38px 14px 2px;gap:13px}.avatar{width:48px;height:48px;flex-basis:48px}.footer-inner{align-items:flex-start;flex-direction:column;gap:16px}}
</style>
</head>
<body>
<div class="container">
<header class="topbar">
<a class="logo" href="index.html">Физические Номера</a>
<a class="back-link" href="index.html">На главную</a>
</header>
<main>
<p class="eyebrow">Сообщество / Пользователи</p>
<h1>Список<br>пользователей.</h1>
<p class="intro">Открытые профили сообщества. Здесь отображаются только никнейм, описание и фотография — email и адреса кошельков не публикуются.</p>
<p class="status" id="usersStatus" aria-live="polite">Загружаем пользователей…</p>
<div class="user-list" id="userList"></div>
<button class="more hidden" id="usersMore" type="button">Показать ещё</button>
</main>
</div>
<footer>
<div class="container footer-inner">
<div class="footer-title">Физические Номера</div>
<div class="copy">© 2026</div>
</div>
</footer>
<script type="module">
const USERS_API_URL = "https://firestore.googleapis.com/v1/projects/physical-numbers/databases/(default)/documents/users";
const USERS_API_KEY = "AIzaSyBqGLonGIt2m_55dt1DWjzhLGnL7m6N0J4";
const USER_PAGE_SIZE = 24;
const PUBLIC_FIELDS = [ "nickname", "googleName", "description", "avatarUrl", "avatarDataUrl" ];
const userList = document.getElementById( "userList" );
const usersStatus = document.getElementById( "usersStatus" );
const usersMore = document.getElementById( "usersMore" );
let nextPageToken = "";

function readString( fields, name ) {
const value = fields && fields[name] && fields[name].stringValue;
return typeof value === "string" ? value : "";
}

function userIdFromDocument( userDocument ) {
const resourceName = typeof userDocument.name === "string" ? userDocument.name : "";
const collectionPath = "/documents/users/";
const collectionIndex = resourceName.lastIndexOf( collectionPath );
return collectionIndex >= 0
? resourceName.slice( collectionIndex + collectionPath.length )
: "";
}

function createUserLink( userDocument ) {
const id = userIdFromDocument( userDocument );
if (!id || id.includes( "/" )) {
return null;
}
const fields = userDocument.fields || {};
const name = readString( fields, "nickname" ).trim()
|| readString( fields, "googleName" ).trim()
|| "Пользователь";
const description = readString( fields, "description" ).trim();
const avatar = readString( fields, "avatarUrl" )
|| readString( fields, "avatarDataUrl" );
const link = document.createElement( "a" );
link.className = "user-link";
link.href = "user.html?" + new URLSearchParams( { id: id } ).toString();
const avatarElement = document.createElement(
avatar.startsWith( "data:image/" ) || avatar.startsWith( "https://" ) ? "img" : "div"
);
avatarElement.className = avatarElement.tagName === "IMG"
? "avatar"
: "avatar avatar-placeholder";
if (avatarElement.tagName === "IMG") {
avatarElement.src = avatar;
avatarElement.alt = "Аватар пользователя " + name;
} else {
avatarElement.setAttribute( "aria-hidden", "true" );
avatarElement.textContent = Array.from( name )[0] || "?";
}
const copy = document.createElement( "div" );
copy.className = "user-copy";
const title = document.createElement( "h2" );
title.textContent = name;
copy.appendChild( title );
if (description) {
const descriptionElement = document.createElement( "p" );
descriptionElement.textContent = description;
copy.appendChild( descriptionElement );
}
link.append( avatarElement, copy );
return link;
}

async function loadUsers( append = false ) {
usersMore.disabled = true;
if (!append) {
usersStatus.textContent = "Загружаем пользователей…";
}
try {
const params = new URLSearchParams( {
key: USERS_API_KEY,
pageSize: String( USER_PAGE_SIZE )
} );
PUBLIC_FIELDS.forEach( function (field) {
params.append( "mask.fieldPaths", field );
} );
if (append && nextPageToken) {
params.set( "pageToken", nextPageToken );
}
const response = await fetch( USERS_API_URL + "?" + params.toString(), {
headers: { Accept: "application/json" },
cache: "no-store"
} );
if (!response.ok) {
throw new Error( "Firestore вернул HTTP " + response.status );
}
const result = await response.json();
const documents = Array.isArray( result.documents ) ? result.documents : [];
documents.forEach( function (document) {
const link = createUserLink( document );
if (link) {
userList.appendChild( link );
}
} );
nextPageToken = result.nextPageToken || "";
usersMore.classList.toggle( "hidden", !nextPageToken );
usersStatus.textContent = userList.childElementCount
? "Пользователей: " + userList.childElementCount
: "Пока нет пользователей с профилями.";
} catch (error) {
console.error( "Не удалось загрузить список пользователей:", error );
usersStatus.textContent = "Не удалось загрузить список пользователей. Возможно, публичное чтение профилей не разрешено в Firebase.";
usersMore.classList.add( "hidden" );
} finally {
usersMore.disabled = false;
}
}

usersMore.addEventListener( "click", function () {
void loadUsers( true );
} );
void loadUsers();
</script>
</body>
</html>
