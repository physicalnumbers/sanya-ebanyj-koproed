<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Публичный профиль пользователя сообщества «Физические Номера».">
<title>Профиль пользователя — Физические Номера</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;scroll-behavior:smooth}
body{background:#f5f5f5;color:#111;font:14px Arial,Helvetica,sans-serif}
a{color:inherit}
.container{width:min(100% - 48px,1100px);margin:0 auto}
.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d8d8d8}
.logo{font-size:18px;font-weight:600;text-decoration:none}
.back-link{color:#555;text-decoration:none}
.back-link:hover{color:#111}
main{min-height:calc(100vh - 210px);padding:76px 0 100px}
.eyebrow{margin:0 0 24px;color:#888;font-size:12px;letter-spacing:2px;text-transform:uppercase}
.profile{max-width:760px;padding:clamp(24px,6vw,56px);border:1px solid #d8d8d8;background:#fafafa}
.profile-heading{display:flex;align-items:center;gap:28px}
.avatar{width:132px;height:132px;flex:0 0 132px;border-radius:50%;object-fit:cover;background:#e5e5e5;color:#555}
.avatar-placeholder{display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:600}
h1{margin:0;font-size:clamp(34px,6vw,58px);font-weight:500;letter-spacing:-3px;line-height:1;overflow-wrap:anywhere}
.description{margin:36px 0 0;color:#555;font-size:16px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.empty-description{color:#888}
.status{min-height:22px;margin-top:24px;color:#777;line-height:1.6}
.notice{max-width:760px;margin:22px 0 0;color:#888;font-size:12px;line-height:1.6}
.admin-panel{max-width:760px;margin-top:24px;padding:18px;border:1px solid #d0d0d0;background:#eee}
.admin-panel h2{margin:0 0 10px;font-size:14px;font-weight:600}
.admin-uid{margin:0 0 14px;color:#555;font-family:monospace;font-size:13px;overflow-wrap:anywhere}
.admin-button{min-height:42px;padding:0 15px;border:1px solid #111;background:#111;color:#fff;cursor:pointer;font:13px Arial}
.admin-button:hover{background:transparent;color:#111}
.admin-button:disabled{opacity:.55;cursor:wait}
.admin-status{min-height:18px;margin-top:10px;color:#666;font-size:12px;line-height:1.5}
.creator-badge{display:inline-block;margin-top:10px;padding:5px 8px;border:1px solid #d0d0d0;color:#777;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.hidden{display:none!important}
footer{min-height:136px;padding:34px 0;background:#111;color:#fff;display:flex;align-items:center}
.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:24px}
.footer-title{font-size:20px}
.copy{color:#888}
@media(max-width:600px){.container{width:calc(100% - 32px)}main{padding:54px 0 70px}.profile{padding:24px}.profile-heading{align-items:flex-start;gap:18px}.avatar{width:88px;height:88px;flex-basis:88px}.avatar-placeholder{font-size:32px}h1{letter-spacing:-2px}.description{margin-top:26px;font-size:15px}.footer-inner{align-items:flex-start;flex-direction:column;gap:16px}}
</style>
</head>
<body>
<div class="container">
<header class="topbar">
<a class="logo" href="index.html">Физические Номера</a>
<a class="back-link" href="users.html">К списку пользователей</a>
</header>
<main>
<p class="eyebrow">Сообщество / Профиль</p>
<article class="profile hidden" id="profile" aria-live="polite">
<div class="profile-heading">
<div class="avatar avatar-placeholder" id="avatar" aria-hidden="true">?</div>
<div>
<h1 id="nickname">Пользователь</h1>
<span class="creator-badge hidden" id="creatorBadge">Создатель сайта</span>
</div>
</div>
<p class="description" id="description"></p>
</article>
<p class="status" id="profileStatus" aria-live="polite">Загружаем профиль…</p>
<p class="notice hidden" id="publicNotice">Это публичная часть профиля. Email и адрес кошелька не отображаются.</p>
<section class="admin-panel hidden" id="adminPanel" aria-labelledby="adminTitle">
<h2 id="adminTitle">Управление пользователем</h2>
<p class="admin-uid" id="adminUid"></p>
<button class="admin-button" id="moderateButton" type="button"></button>
<div class="admin-status" id="moderationStatus" aria-live="polite"></div>
</section>
</main>
</div>
<footer>
<div class="container footer-inner">
<div class="footer-title">Физические Номера</div>
<div class="copy">© 2026</div>
</div>
</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const FUNCTIONS_URL = "https://us-central1-physical-numbers.cloudfunctions.net";
const profileElement = document.getElementById( "profile" );
const profileStatus = document.getElementById( "profileStatus" );
const publicNotice = document.getElementById( "publicNotice" );
const adminPanel = document.getElementById( "adminPanel" );
const adminUid = document.getElementById( "adminUid" );
const moderateButton = document.getElementById( "moderateButton" );
const moderationStatus = document.getElementById( "moderationStatus" );
const creatorBadge = document.getElementById( "creatorBadge" );
const avatar = document.getElementById( "avatar" );
const nicknameElement = document.getElementById( "nickname" );
const descriptionElement = document.getElementById( "description" );
const app = initializeApp( {
apiKey: "AIzaSyBqGLonGIt2m_55dt1DWjzhLGnL7m6N0J4",
authDomain: "physical-numbers.firebaseapp.com",
projectId: "physical-numbers",
storageBucket: "physical-numbers.firebasestorage.app",
messagingSenderId: "1031207446971",
appId: "1:1031207446971:web:ed03e122d4727f8e28fc9e",
measurementId: "G-S8J83CEQWL"
} );
const auth = getAuth( app );
let currentUser = null;
let profileUid = "";
let isAdmin = false;
let isBanned = false;
let isCreator = false;

function readString( fields, name ) {
const rawValue = fields && fields[name];
const value = typeof rawValue === "string"
? rawValue
: rawValue && rawValue.stringValue;
return typeof value === "string" ? value : "";
}

function showProfile( user ) {
const nickname = readString( user, "nickname" ).trim()
|| readString( user, "googleName" ).trim()
|| "Пользователь";
const description = readString( user, "description" ).trim();
const avatarValue = readString( user, "avatarUrl" );
nicknameElement.textContent = nickname;
document.title = nickname + " — Физические Номера";
descriptionElement.textContent = description || "Пользователь пока ничего не рассказал о себе.";
descriptionElement.classList.toggle( "empty-description", !description );
if ( avatarValue.startsWith( "data:image/" ) || avatarValue.startsWith( "https://" ) ) {
const image = document.createElement( "img" );
image.className = "avatar";
image.alt = "Аватар пользователя " + nickname;
image.src = avatarValue;
avatar.replaceWith( image );
} else {
avatar.textContent = Array.from( nickname )[0] || "?";
}
profileElement.classList.remove( "hidden" );
profileStatus.classList.add( "hidden" );
publicNotice.classList.remove( "hidden" );
isCreator = user.isCreator === true;
creatorBadge.classList.toggle( "hidden", !isCreator );
if ( isAdmin && profileUid ) {
adminUid.textContent = "Firebase UID: " + profileUid;
adminPanel.classList.remove( "hidden" );
moderateButton.classList.toggle( "hidden", isCreator );
updateModerationButton();
}
}

function updateModerationButton() {
moderateButton.textContent = isBanned ? "Разблокировать пользователя" : "Заблокировать пользователя";
}

async function loadProfile() {
const id = new URLSearchParams( window.location.search ).get( "id" );
if (!id || id.includes( "/" ) || id.length > 256) {
profileStatus.textContent = "Не удалось определить пользователя. Вернитесь к списку и выберите профиль ещё раз.";
return;
}
try {
const headers = { Accept: "application/json" };
if (currentUser) {
headers.Authorization = "Bearer " + await currentUser.getIdToken();
}
const response = await fetch(
FUNCTIONS_URL + "/publicUsers?" + new URLSearchParams( { id: id } ).toString(),
{ headers, cache: "no-store" }
);
if (response.status === 404) {
profileStatus.textContent = "Профиль не найден. Возможно, он был удалён.";
return;
}
if (!response.ok) {
throw new Error( "Firestore вернул HTTP " + response.status );
}
const result = await response.json();
isAdmin = result.isAdmin === true;
const user = result.user || {};
profileUid = isAdmin && typeof user.uid === "string" ? user.uid : "";
isBanned = isAdmin && user.isBanned === true;
showProfile( user );
} catch (error) {
console.error( "Не удалось загрузить профиль пользователя:", error );
profileStatus.textContent = "Не удалось загрузить профиль. Попробуйте обновить страницу.";
}
}

moderateButton.addEventListener( "click", async function () {
if (!isAdmin || !profileUid) {
return;
}
const action = isBanned ? "unban" : "ban";
const confirmation = isBanned
? "Разблокировать этого пользователя?"
: "Заблокировать пользователя? Он потеряет доступ к аккаунту и профилю.";
if (!window.confirm( confirmation )) {
return;
}
moderateButton.disabled = true;
moderationStatus.textContent = action === "ban" ? "Блокируем пользователя…" : "Разблокируем пользователя…";
try {
const response = await fetch( FUNCTIONS_URL + "/moderateUser", {
method: "POST",
headers: {
Authorization: "Bearer " + await currentUser.getIdToken(),
Accept: "application/json",
"Content-Type": "application/json"
},
body: JSON.stringify( { action: action, targetUid: profileUid } )
} );
const result = await response.json().catch( function () { return {}; } );
if (!response.ok) {
throw new Error( result.error || "HTTP " + response.status );
}
isBanned = action === "ban";
updateModerationButton();
moderationStatus.textContent = isBanned
? "Пользователь заблокирован."
: "Пользователь разблокирован.";
} catch (error) {
console.error( "Не удалось изменить статус пользователя:", error );
moderationStatus.textContent = error.message || "Не удалось выполнить действие.";
} finally {
moderateButton.disabled = false;
}
} );

onAuthStateChanged( auth, function (user) {
currentUser = user;
void loadProfile();
} );
</script>
</body>
</html>
