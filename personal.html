<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Личный кабинет</title>

<style>

*{
box-sizing:border-box;
margin:0
}

html{
scroll-behavior:smooth
}

body{
background:#f5f5f5;
color:#111;
font:14px Arial;
overflow-x:hidden
}

header{
position:fixed;
z-index:1000;
top:0;
width:100%;
height:74px;
padding:0 42px;
display:flex;
justify-content:space-between;
align-items:center;
background:#f5f5f5eb;
border-bottom:1px solid #d8d8d8;
backdrop-filter:blur(12px)
}

.logo{
font-size:18px;
font-weight:600
}

nav{
display:flex;
gap:34px
}

nav a{
color:#555;
text-decoration:none
}

nav a:hover{
color:#000
}

main{
padding:120px 7vw;
min-height:100vh
}

h1{
font-size:clamp(50px,8vw,120px);
line-height:.9;
letter-spacing:-6px;
font-weight:500
}

</style>
</head>

<body>

<header>

<div class="logo">
Физические Номера
</div>

<nav>

<a href="index.html">
На главную
</a>

</nav>

</header>

<main>

<h1>
Личный<br>
кабинет
</h1>

</main>

</body>
</html>
