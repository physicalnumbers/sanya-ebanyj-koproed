<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Личный кабинет</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } body { min-height: 100vh; font-family: Arial, Helvetica, sans-serif; color: #fff; background: radial-gradient( circle at 15% 20%, rgba(255, 43, 43, 0.10), transparent 32% ), radial-gradient( circle at 85% 80%, rgba(90, 50, 255, 0.08), transparent 30% ), #080808; } header { height: 64px; width: 100%; display: flex; align-items: center; justify-content: flex-end; padding: 0 30px; background: rgba(10, 10, 10, 0.88); border-bottom: 1px solid rgba(255, 255, 255, 0.07); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(12px); } .back-link { color: #aaa; text-decoration: none; padding: 9px 14px; border-radius: 9px; transition: 0.2s; } .back-link:hover { color: #fff; background: rgba(255, 255, 255, 0.07); } main { width: min(1100px, calc(100% - 30px)); margin: 45px auto 80px; } .page-title { margin-bottom: 28px; } .page-title h1 { font-size: 35px; margin-bottom: 8px; } .page-title p { color: #777; font-size: 14px; } /* LOGIN */ .login-card { width: min(520px, 100%); margin: 80px auto; padding: 35px; text-align: center; background: rgba(18, 18, 18, 0.96); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45); } .login-card h2 { font-size: 27px; margin-bottom: 10px; } .login-card p { color: #888; line-height: 1.5; margin-bottom: 25px; } /* CABINET */ .cabinet { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 24px; align-items: start; } .card { background: rgba(18, 18, 18, 0.96); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; box-shadow: 0 20px 70px rgba(0, 0, 0, 0.30); } /* LEFT PROFILE */ .profile-side { padding: 28px; text-align: center; } .avatar-wrapper { width: 150px; height: 150px; margin: 0 auto 20px; position: relative; } .avatar { width: 150px; height: 150px; display: block; object-fit: cover; border-radius: 50%; border: 3px solid #ff2b2b; background: #191919; box-shadow: 0 0 35px rgba(255, 43, 43, 0.18); } .avatar-placeholder { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: linear-gradient( 145deg, #252525, #111 ); border: 3px solid #ff2b2b; color: #777; font-size: 48px; font-weight: 700; } .profile-name { font-size: 21px; font-weight: 700; margin-bottom: 7px; word-break: break-word; } .profile-email { color: #777; font-size: 13px; word-break: break-word; } .status { display: inline-flex; align-items: center; gap: 7px; margin-top: 18px; padding: 7px 12px; border-radius: 20px; color: #aaa; background: rgba(255, 255, 255, 0.05); font-size: 12px; } .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #42e66c; box-shadow: 0 0 8px rgba(66, 230, 108, 0.7); } /* FORM */ .profile-form { padding: 30px; } .profile-form h2 { font-size: 24px; margin-bottom: 8px; } .form-description { color: #777; font-size: 14px; margin-bottom: 30px; } .form-group { margin-bottom: 22px; } .form-group label { display: block; color: #ccc; font-size: 14px; font-weight: 600; margin-bottom: 8px; } input[type="text"], textarea { width: 100%; padding: 14px 15px; color: #fff; background: #111; border: 1px solid #2a2a2a; border-radius: 11px; outline: none; font-family: inherit; font-size: 15px; transition: 0.2s; } input[type="text"]:focus, textarea:focus { border-color: #ff2b2b; box-shadow: 0 0 0 3px rgba(255, 43, 43, 0.08); } textarea { min-height: 130px; resize: vertical; } .file-input { width: 100%; padding: 12px; color: #aaa; background: #111; border: 1px dashed #333; border-radius: 11px; cursor: pointer; } .file-input:hover { border-color: #ff2b2b; } /* BUTTONS */ .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; } .button { border: none; outline: none; padding: 13px 20px; border-radius: 11px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.15s transform, 0.15s background, 0.15s opacity; } .button:hover { transform: translateY(-1px); } .button:active { transform: translateY(0); } .button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; } .google-button { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; color: #111; background: #fff; } .google-button:hover { background: #eee; } .google-icon { font-weight: 900; font-size: 18px; } .save-button { color: #fff; background: #ff2b2b; } .save-button:hover { background: #e82121; } .logout { color: #ddd; background: #242424; } .logout:hover { background: #303030; } /* MESSAGES */ .message { min-height: 20px; margin-top: 17px; font-size: 14px; line-height: 1.45; } .message.success { color: #4ade80; } .message.error { color: #ff5555; } .message.info { color: #aaa; } /* HIDDEN */ .hidden { display: none !important; } /* MOBILE */ @media (max-width: 800px) { header { padding: 0 18px; } .cabinet { grid-template-columns: 1fr; } .page-title h1 { font-size: 29px; } } @media (max-width: 500px) { main { width: calc(100% - 20px); margin-top: 30px; } header { height: 58px; } .profile-form { padding: 22px; } .login-card { padding: 25px; } .buttons { flex-direction: column; } .button { width: 100%; } } </style> </head> <body> <header> <a href="index.html" class="back-link" > ← На главную </a> </header> <main> <div class="page-title"> <h1> Личный кабинет </h1> <p> Управление профилем и аккаунтом </p> </div> <!-- LOGIN --> <section id="loginSection" class="login-card" > <h2> Добро пожаловать </h2> <p> Войди через Google, чтобы открыть свой профиль. </p> <button id="googleLoginButton" class="button google-button" type="button" > <span class="google-icon"> G </span> Войти через Google </button> <div id="loginMessage" class="message" ></div> </section> <!-- CABINET --> <section id="cabinetSection" class="cabinet hidden" > <!-- LEFT PROFILE --> <aside class="card profile-side" > <div class="avatar-wrapper"> <div id="avatarPlaceholder" class="avatar-placeholder" > ? </div> <img id="avatar" class="avatar hidden" src="" alt="Аватар" > </div> <div id="profileName" class="profile-name" > Пользователь </div> <div id="profileEmail" class="profile-email" > </div> <div class="status"> <span class="status-dot"></span> Аккаунт активен </div> </aside> <!-- RIGHT --> <section class="card profile-form" > <h2> Настройки профиля </h2> <p class="form-description"> Здесь можно изменить данные своего профиля. </p> <!-- AVATAR --> <div class="form-group"> <label for="avatarFile"> Аватар </label> <input type="file" id="avatarFile" class="file-input" accept=".jpg,.jpeg,.png,.webp,.gif,image/jpeg,image/png,image/webp,image/gif" > </div> <!-- NICKNAME --> <div class="form-group"> <label for="nickname"> Никнейм </label> <input type="text" id="nickname" maxlength="30" placeholder="Введите никнейм" > </div> <!-- DESCRIPTION --> <div class="form-group"> <label for="description"> О себе </label> <textarea id="description" maxlength="500" placeholder="Расскажи немного о себе..." ></textarea> </div> <!-- BUTTONS --> <div class="buttons"> <button id="saveButton" class="button save-button" type="button" > Сохранить профиль </button> <button id="logoutButton" class="button logout" type="button" > Выйти из аккаунта </button> </div> <div id="profileMessage" class="message" ></div> </section> </section> </main> <script type="module"> /* ===================================================== FIREBASE IMPORTS ===================================================== */ import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js"; import { initializeAuth, browserLocalPersistence, browserPopupRedirectResolver, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js"; import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js"; import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js"; /* ===================================================== FIREBASE CONFIG ===================================================== */ const firebaseConfig = { apiKey: "AIzaSyBqGLonGIt2m_55dt1DWjzhLGnL7m6N0J4", authDomain: "physical-numbers.firebaseapp.com", projectId: "physical-numbers", storageBucket: "physical-numbers.firebasestorage.app", messagingSenderId: "1031207446971", appId: "1:1031207446971:web:ed03e122d4727f8e28fc9", measurementId: "G-S8J83CEQWL" }; /* ===================================================== FIREBASE INIT ===================================================== */ const app = initializeApp( firebaseConfig ); const auth = initializeAuth( app, { persistence: browserLocalPersistence, popupRedirectResolver: browserPopupRedirectResolver } ); const db = getFirestore( app ); const storage = getStorage( app ); const googleProvider = new GoogleAuthProvider(); googleProvider.setCustomParameters({ prompt: "select_account" }); /* ===================================================== ELEMENTS ===================================================== */ const loginSection = document.getElementById( "loginSection" ); const cabinetSection = document.getElementById( "cabinetSection" ); const googleLoginButton = document.getElementById( "googleLoginButton" ); const logoutButton = document.getElementById( "logoutButton" ); const saveButton = document.getElementById( "saveButton" ); const avatarFile = document.getElementById( "avatarFile" ); const avatar = document.getElementById( "avatar" ); const avatarPlaceholder = document.getElementById( "avatarPlaceholder" ); const nickname = document.getElementById( "nickname" ); const description = document.getElementById( "description" ); const profileName = document.getElementById( "profileName" ); const profileEmail = document.getElementById( "profileEmail" ); const loginMessage = document.getElementById( "loginMessage" ); const profileMessage = document.getElementById( "profileMessage" ); let currentUser = null; let uploadedAvatarUrl = ""; /* ===================================================== MESSAGES ===================================================== */ function loginMsg( text, type = "info" ) { loginMessage.textContent = text; loginMessage.className = "message " + type; } function profileMsg( text, type = "info" ) { profileMessage.textContent = text; profileMessage.className = "message " + type; } /* ===================================================== AVATAR DISPLAY ===================================================== */ function showAvatar( url, name = "" ) { if (url) { avatar.src = url; avatar.classList.remove( "hidden" ); avatarPlaceholder.classList.add( "hidden" ); return; } avatar.src = ""; avatar.classList.add( "hidden" ); avatarPlaceholder.classList.remove( "hidden" ); const firstLetter = name ? name .trim() .charAt(0) .toUpperCase() : "?"; avatarPlaceholder.textContent = firstLetter || "?"; } /* ===================================================== LOAD PROFILE ===================================================== */ async function loadProfile( user ) { try { const userRef = doc( db, "users", user.uid ); const snapshot = await getDoc( userRef ); if ( snapshot.exists() ) { const data = snapshot.data(); nickname.value = data.nickname || user.displayName || ""; description.value = data.description || ""; uploadedAvatarUrl = data.avatarUrl || ""; profileName.textContent = data.nickname || user.displayName || "Пользователь"; showAvatar( uploadedAvatarUrl || user.photoURL || "", profileName.textContent ); } else { nickname.value = user.displayName || ""; description.value = ""; uploadedAvatarUrl = ""; profileName.textContent = user.displayName || "Пользователь"; showAvatar( user.photoURL || "", profileName.textContent ); } } catch (error) { console.error( "Ошибка загрузки профиля:", error ); profileMsg( "Не удалось загрузить профиль: " + error.message, "error" ); } } /* ===================================================== GOOGLE LOGIN ===================================================== */ googleLoginButton.addEventListener( "click", async () => { googleLoginButton.disabled = true; loginMsg( "Открываем Google...", "info" ); try { await signInWithPopup( auth, googleProvider ); } catch (error) { console.error( "Google login error:", error ); if ( error.code === "auth/popup-blocked" ) { loginMsg( "Окно Google заблокировано. Переключаемся на вход через страницу...", "info" ); try { await signInWithRedirect( auth, googleProvider ); return; } catch ( redirectError ) { console.error( redirectError ); loginMsg( "Ошибка входа: " + redirectError.message, "error" ); } } else if ( error.code === "auth/popup-closed-by-user" ) { loginMsg( "Окно Google было закрыто.", "error" ); } else if ( error.code === "auth/unauthorized-domain" ) { loginMsg( "Домен сайта не разрешён в Firebase Authentication.", "error" ); } else if ( error.code === "auth/api-key-not-valid" ) { loginMsg( "Firebase API key указан неправильно.", "error" ); } else { loginMsg( "Ошибка Google: " + ( error.message || error.code || "неизвестная ошибка" ), "error" ); } } finally { googleLoginButton.disabled = false; } } ); /* ===================================================== REDIRECT RESULT ===================================================== */ try { const redirectResult = await getRedirectResult( auth ); if ( redirectResult && redirectResult.user ) { console.log( "Вход через redirect выполнен." ); } } catch (error) { console.error( "Redirect error:", error ); loginMsg( "Ошибка входа через Google: " + ( error.message || error.code ), "error" ); } /* ===================================================== AVATAR UPLOAD ===================================================== */ avatarFile.addEventListener( "change", async () => { const file = avatarFile.files?.[0]; if (!file) { return; } if (!currentUser) { profileMsg( "Сначала войди в аккаунт.", "error" ); avatarFile.value = ""; return; } /* ALLOWED TYPES */ const allowedTypes = [ "image/jpeg", "image/png", "image/webp", "image/gif" ]; const allowedExtensions = [ "jpg", "jpeg", "png", "webp", "gif" ]; const extension = file.name .split(".") .pop() .toLowerCase(); const typeAllowed = allowedTypes.includes( file.type ); const extensionAllowed = allowedExtensions.includes( extension ); if ( !typeAllowed && !extensionAllowed ) { profileMsg( "Можно загрузить JPG, JPEG, PNG, WEBP или GIF.", "error" ); avatarFile.value = ""; return; } /* SIZE */ if ( file.size > 10 * 1024 * 1024 ) { profileMsg( "Файл слишком большой. Максимум 10 МБ.", "error" ); avatarFile.value = ""; return; } /* LOCAL PREVIEW */ const previewUrl = URL.createObjectURL( file ); showAvatar( previewUrl, nickname.value || currentUser.displayName || "" ); profileMsg( "Аватар выбран. Загружаем в Firebase...", "info" ); try { /* Загружаем файл в: Firebase Storage users / UID / avatar.jpg */ const extensionForStorage = extension === "jpeg" ? "jpg" : extension; const storagePath = "users/" + currentUser.uid + "/avatar." + extensionForStorage; const avatarRef = ref( storage, storagePath ); await uploadBytes( avatarRef, file, { contentType: file.type } ); /* GET PERMANENT DOWNLOAD URL */ const downloadUrl = await getDownloadURL( avatarRef ); uploadedAvatarUrl = downloadUrl; /* Сразу сохраняем URL в Firestore. Поэтому даже если пользователь забудет нажать кнопку сохранения, ссылка на новый аватар уже будет записана. */ await setDoc( doc( db, "users", currentUser.uid ), { avatarUrl: uploadedAvatarUrl, updatedAt: Date.now() }, { merge: true } ); showAvatar( uploadedAvatarUrl, nickname.value || currentUser.displayName || "" ); profileMsg( "Аватар успешно загружен и сохранён.", "success" ); } catch (error) { console.error( "Firebase Storage error:", error ); /* Превью оставляем, но сообщаем настоящую ошибку. */ if ( error.code === "storage/unauthorized" ) { profileMsg( "Firebase Storage запретил загрузку. Нужно проверить правила Storage.", "error" ); } else if ( error.code === "storage/object-not-found" ) { profileMsg( "Firebase Storage не найден.", "error" ); } else { profileMsg( "Ошибка загрузки аватара: " + ( error.message || error.code ), "error" ); } } finally { avatarFile.value = ""; } } ); /* ===================================================== SAVE PROFILE ===================================================== */ saveButton.addEventListener( "click", async () => { if (!currentUser) { profileMsg( "Ты не авторизован.", "error" ); return; } const nick = nickname.value.trim(); const about = description.value.trim(); if ( nick.length < 2 ) { profileMsg( "Никнейм должен содержать минимум 2 символа.", "error" ); nickname.focus(); return; } saveButton.disabled = true; profileMsg( "Сохраняем профиль...", "info" ); try { const userRef = doc( db, "users", currentUser.uid ); await setDoc( userRef, { uid: currentUser.uid, email: currentUser.email || "", nickname: nick, description: about, avatarUrl: uploadedAvatarUrl || currentUser.photoURL || "", updatedAt: Date.now() }, { merge: true } ); profileName.textContent = nick; showAvatar( uploadedAvatarUrl || currentUser.photoURL || "", nick ); profileMsg( "Профиль успешно сохранён.", "success" ); } catch (error) { console.error( "Firestore error:", error ); if ( error.code === "permission-denied" ) { profileMsg( "Firestore запретил сохранение профиля. Проверь правила Firestore.", "error" ); } else { profileMsg( "Ошибка сохранения: " + ( error.message || error.code ), "error" ); } } finally { saveButton.disabled = false; } } ); /* ===================================================== LOGOUT ===================================================== */ logoutButton.addEventListener( "click", async () => { logoutButton.disabled = true; try { await signOut( auth ); } catch (error) { console.error( error ); profileMsg( "Ошибка выхода: " + error.message, "error" ); logoutButton.disabled = false; } } ); /* ===================================================== AUTH STATE ===================================================== */ onAuthStateChanged( auth, async (user) => { currentUser = user; if (user) { loginSection.classList.add( "hidden" ); cabinetSection.classList.remove( "hidden" ); profileEmail.textContent = user.email || ""; profileName.textContent = user.displayName || "Пользователь"; showAvatar( user.photoURL || "", user.displayName || "" ); await loadProfile( user ); } else { loginSection.classList.remove( "hidden" ); cabinetSection.classList.add( "hidden" ); currentUser = null; } } ); </script> </body> </html>
