<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Личный кабинет</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

html{
scroll-behavior:smooth
}

body{
background:#f5f5f5;
color:#111;
font:14px Arial,sans-serif;
overflow-x:hidden
}

header{
position:fixed;
z-index:1000;
top:0;
width:100%;
height:74px;
padding:0 42px;
display:flex;
justify-content:space-between;
align-items:center;
background:#f5f5f5eb;
border-bottom:1px solid #d8d8d8;
backdrop-filter:blur(12px)
}

.logo{
font-size:18px;
font-weight:600
}

nav{
display:flex;
gap:34px
}

nav a{
color:#555;
text-decoration:none
}

nav a:hover{
color:#000
}

main{
min-height:100vh;
padding:140px 7vw 80px
}

.hero{
max-width:1100px
}

h1{
font-size:clamp(50px,8vw,120px);
line-height:.9;
letter-spacing:-6px;
font-weight:500;
margin-bottom:50px
}

.subtitle{
font-size:18px;
color:#666;
max-width:600px;
line-height:1.6;
margin-bottom:35px
}

.button{
display:inline-flex;
align-items:center;
justify-content:center;
padding:16px 24px;
background:#111;
color:#fff;
border:none;
text-decoration:none;
font-size:14px;
cursor:pointer;
transition:.2s
}

.button:hover{
background:#333
}

.card{
display:none;
max-width:650px;
margin-top:30px;
padding:30px;
background:#fff;
border:1px solid #ddd
}

.card.active{
display:block
}

.user{
display:flex;
align-items:center;
gap:18px;
margin-bottom:25px
}

.avatar{
width:64px;
height:64px;
border-radius:50%;
object-fit:cover;
background:#ddd
}

.user-name{
font-size:20px;
font-weight:600
}

.user-email{
margin-top:5px;
color:#777
}

.status{
margin-top:25px;
padding-top:20px;
border-top:1px solid #ddd;
color:#666
}

.error{
display:none;
margin-top:20px;
padding:15px;
background:#fff0f0;
border:1px solid #ffb5b5;
color:#b00000
}

@media(max-width:800px){

header{
padding:0 20px
}

nav{
gap:15px
}

main{
padding:120px 20px 60px
}

h1{
letter-spacing:-4px
}

}

@media(max-width:420px){

header{
height:65px
}

.logo{
font-size:16px
}

nav a{
font-size:12px
}

main{
padding-top:110px
}

}

</style>
</head>

<body>

<header>

<div class="logo">
Физические Номера
</div>

<nav>
<a href="index.html">На главную</a>
</nav>

</header>


<main>

<section class="hero">

<h1>
Личный<br>
кабинет
</h1>

<p class="subtitle" id="description">
У вас пока нет личного кабинета.
Создать его можно через Google.
</p>

<button class="button" id="loginButton">
Создать кабинет
</button>


<div class="card" id="accountCard">

<div class="user">

<img
class="avatar"
id="avatar"
src=""
alt="Аватар"
>

<div>

<div class="user-name" id="userName">
Пользователь
</div>

<div class="user-email" id="userEmail">
</div>

</div>

</div>

<div class="status">
Google-аккаунт успешно подключён.
<br><br>
Следующим шагом добавим настройки профиля.
</div>

</div>


<div class="error" id="errorBox"></div>

</section>

</main>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {

apiKey: "AIzaSyBqGLonGIt2m_55dt1DWjzhLGnL7m6N0J4",

authDomain: "physical-numbers.firebaseapp.com",

projectId: "physical-numbers",

storageBucket: "physical-numbers.firebasestorage.app",

messagingSenderId: "1031207446971",

appId: "1:1031207446971:web:ed03e122d4727f8e28fc9e",

measurementId: "G-S8J83CEQWL"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


const loginButton =
document.getElementById("loginButton");

const description =
document.getElementById("description");

const accountCard =
document.getElementById("accountCard");

const userName =
document.getElementById("userName");

const userEmail =
document.getElementById("userEmail");

const avatar =
document.getElementById("avatar");

const errorBox =
document.getElementById("errorBox");


function showError(message){

errorBox.textContent = message;

errorBox.style.display = "block";

}


loginButton.addEventListener("click", async () => {

errorBox.style.display = "none";

loginButton.disabled = true;

loginButton.textContent = "Подключение...";


try{

await signInWithPopup(auth,provider);

}

catch(error){

console.error(error);

if(error.code === "auth/popup-closed-by-user"){

showError("Окно входа было закрыто.");

}
else if(error.code === "auth/popup-blocked"){

showError("Браузер заблокировал окно Google. Разреши всплывающие окна для сайта.");

}
else{

showError(
"Не удалось войти через Google. Код ошибки: " +
error.code
);

}

loginButton.disabled = false;

loginButton.textContent = "Создать кабинет";

}

});


onAuthStateChanged(auth,(user) => {

if(user){

description.textContent =
"Ваш личный кабинет уже создан.";

loginButton.style.display = "none";

accountCard.classList.add("active");

userName.textContent =
user.displayName || "Пользователь";

userEmail.textContent =
user.email || "";

if(user.photoURL){

avatar.src = user.photoURL;

}

}
else{

description.textContent =
"У вас пока нет личного кабинета. Создать его можно через Google.";

loginButton.style.display = "inline-flex";

accountCard.classList.remove("active");

}

});

</script>

</body>
</html>
