<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Личный кабинет</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 43, 43, 0.12), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(120, 0, 255, 0.10), transparent 30%),
        #080808;
    }

    header {
      height: 70px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 35px;

      background: rgba(10, 10, 10, 0.88);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);

      position: sticky;
      top: 0;
      z-index: 1000;

      backdrop-filter: blur(12px);
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .back-link {
      color: #aaa;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 10px;
      transition: 0.2s;
    }

    .back-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
    }

    main {
      width: min(1100px, calc(100% - 30px));
      margin: 50px auto 80px;
    }

    .page-title {
      margin-bottom: 30px;
    }

    .page-title h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .page-title p {
      color: #888;
      font-size: 15px;
    }

    /* LOGIN */

    .login-card {
      max-width: 520px;
      margin: 80px auto;
      padding: 35px;

      background: rgba(20, 20, 20, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;

      text-align: center;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.4);
    }

    .login-card h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .login-card p {
      color: #888;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    /* LAYOUT */

    .cabinet {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 25px;
      align-items: start;
    }

    .card {
      background: rgba(18, 18, 18, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.3);
    }

    /* SIDEBAR */

    .profile-side {
      padding: 28px;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto 20px;
    }

    .avatar {
      width: 150px;
      height: 150px;

      display: block;

      object-fit: cover;
      border-radius: 50%;

      background: #222;
      border: 3px solid #ff2b2b;

      box-shadow: 0 0 35px rgba(255, 43, 43, 0.18);
    }

    .avatar-placeholder {
      width: 150px;
      height: 150px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: linear-gradient(145deg, #222, #111);

      border: 3px solid #ff2b2b;

      font-size: 48px;
      font-weight: 700;
      color: #777;
    }

    .profile-name {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 6px;

      word-break: break-word;
    }

    .profile-email {
      color: #777;
      font-size: 13px;

      word-break: break-word;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      margin-top: 18px;
      padding: 7px 12px;

      color: #bbb;
      background: rgba(255, 255, 255, 0.05);

      border-radius: 20px;
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #42e66c;
      box-shadow: 0 0 8px rgba(66, 230, 108, 0.7);
    }

    /* FORM */

    .profile-form {
      padding: 30px;
    }

    .profile-form h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .form-description {
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;

      color: #ccc;
      font-size: 14px;
      font-weight: 600;
    }

    input[type="text"],
    textarea {
      width: 100%;

      padding: 14px 15px;

      color: #fff;
      background: #111;

      border: 1px solid #2a2a2a;
      border-radius: 11px;

      outline: none;

      font-family: inherit;
      font-size: 15px;

      transition: 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #ff2b2b;
      box-shadow: 0 0 0 3px rgba(255, 43, 43, 0.08);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .file-input {
      width: 100%;
      padding: 12px;

      color: #aaa;
      background: #111;

      border: 1px dashed #333;
      border-radius: 11px;

      cursor: pointer;
    }

    .file-input:hover {
      border-color: #ff2b2b;
    }

    /* BUTTONS */

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;

      margin-top: 30px;
    }

    button {
      font-family: inherit;
    }

    .button {
      border: none;
      outline: none;

      padding: 13px 20px;

      border-radius: 11px;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s,
        background 0.15s,
        opacity 0.15s;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .save-button {
      color: #fff;
      background: #ff2b2b;
    }

    .save-button:hover {
      background: #e82020;
    }

    .logout {
      color: #ddd;
      background: #242424;
    }

    .logout:hover {
      background: #303030;
    }

    .google-button {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      color: #111;
      background: #fff;
    }

    .google-button:hover {
      background: #eee;
    }

    /* MESSAGE */

    .message {
      min-height: 20px;
      margin-top: 18px;

      font-size: 14px;
      line-height: 1.4;
    }

    .message.success {
      color: #4ade80;
    }

    .message.error {
      color: #ff5555;
    }

    .message.info {
      color: #aaa;
    }

    /* HIDDEN */

    .hidden {
      display: none !important;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      header {
        padding: 0 18px;
      }

      .cabinet {
        grid-template-columns: 1fr;
      }

      .profile-side {
        padding: 25px;
      }

      .page-title h1 {
        font-size: 29px;
      }
    }

    @media (max-width: 500px) {
      main {
        width: min(100% - 20px, 1100px);
        margin-top: 30px;
      }

      header {
        height: 60px;
      }

      .logo {
        font-size: 17px;
      }

      .back-link {
        padding: 8px 10px;
        font-size: 13px;
      }

      .profile-form {
        padding: 22px;
      }

      .buttons {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">
      кайфовать.вместе
    </a>

    <a href="index.html" class="back-link">
      На главную
    </a>
  </header>


  <main>

    <!-- ЗАГОЛОВОК -->

    <div class="page-title">
      <h1>Личный кабинет</h1>
      <p>Управляй своим профилем и настройками аккаунта.</p>
    </div>


    <!-- НЕ АВТОРИЗОВАН -->

    <section id="loginSection" class="login-card">

      <h2>Добро пожаловать</h2>

      <p>
        Войди через Google, чтобы открыть свой личный кабинет.
      </p>

      <button
        class="button google-button"
        id="googleLoginButton"
        type="button"
      >
        <span>G</span>
        Войти через Google
      </button>

      <div id="loginMessage" class="message"></div>

    </section>


    <!-- ЛИЧНЫЙ КАБИНЕТ -->

    <section id="cabinetSection" class="cabinet hidden">

      <!-- ЛЕВАЯ КАРТОЧКА -->

      <aside class="card profile-side">

        <div class="avatar-wrapper">

          <div
            id="avatarPlaceholder"
            class="avatar-placeholder"
          >
            ?
          </div>

          <img
            id="avatar"
            class="avatar hidden"
            src=""
            alt="Аватар"
          >

        </div>

        <div
          id="profileName"
          class="profile-name"
        >
          Пользователь
        </div>

        <div
          id="profileEmail"
          class="profile-email"
        >
          email
        </div>

        <div class="status">
          <span class="status-dot"></span>
          Аккаунт активен
        </div>

      </aside>


      <!-- ПРАВАЯ КАРТОЧКА -->

      <section class="card profile-form">

        <h2>Настройки профиля</h2>

        <p class="form-description">
          Измени информацию, которая будет отображаться в твоём профиле.
        </p>


        <!-- АВАТАР -->

        <div class="form-group">

          <label for="avatarFile">
            Аватар
          </label>

          <input
  type="file"
  id="avatarFile"
  class="file-input"
  accept=".jpg,.jpeg,.png,.webp,.gif,image/jpeg,image/png,image/webp,image/gif"
>

        </div>


        <!-- НИКНЕЙМ -->

        <div class="form-group">

          <label for="nickname">
            Никнейм
          </label>

          <input
            type="text"
            id="nickname"
            maxlength="30"
            placeholder="Введите никнейм"
          >

        </div>


        <!-- ОПИСАНИЕ -->

        <div class="form-group">

          <label for="description">
            О себе
          </label>

          <textarea
            id="description"
            maxlength="500"
            placeholder="Расскажи немного о себе..."
          ></textarea>

        </div>


        <!-- КНОПКИ -->

        <div class="buttons">

          <button
            class="button save-button"
            id="saveButton"
            type="button"
          >
            Сохранить профиль
          </button>

          <button
            class="button logout"
            id="logoutButton"
            type="button"
          >
            Выйти из аккаунта
          </button>

        </div>


        <div
          id="profileMessage"
          class="message"
        ></div>

      </section>

    </section>

  </main>


  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserLocalPersistence
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /* =========================================
       FIREBASE CONFIG
       ========================================= */

    const firebaseConfig = {

      apiKey: "AIzaSyBqGLonGIt2m_55dt1DWjzhLGnL7m6N0J4",

      authDomain:
        "physical-numbers.firebaseapp.com",

      projectId:
        "physical-numbers",

      storageBucket:
        "physical-numbers.firebasestorage.app",

      messagingSenderId:
        "1031207446971",

      appId:
        "1:1031207446971:web:ed03e122d4727f8e28fc9e",

      measurementId:
        "G-S8J83CEQWL"

    };


    /* =========================================
       FIREBASE INIT
       ========================================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const provider = new GoogleAuthProvider();


    /* =========================================
       ELEMENTS
       ========================================= */

    const loginSection =
      document.getElementById("loginSection");

    const cabinetSection =
      document.getElementById("cabinetSection");

    const googleLoginButton =
      document.getElementById("googleLoginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const saveButton =
      document.getElementById("saveButton");

    const avatarFile =
      document.getElementById("avatarFile");

    const avatar =
      document.getElementById("avatar");

    const avatarPlaceholder =
      document.getElementById("avatarPlaceholder");

    const nickname =
      document.getElementById("nickname");

    const description =
      document.getElementById("description");

    const profileName =
      document.getElementById("profileName");

    const profileEmail =
      document.getElementById("profileEmail");

    const loginMessage =
      document.getElementById("loginMessage");

    const profileMessage =
      document.getElementById("profileMessage");


    let currentUser = null;
    let uploadedAvatarUrl = "";


    /* =========================================
       MESSAGE
       ========================================= */

    function showLoginMessage(text, type = "info") {

      loginMessage.textContent = text;

      loginMessage.className =
        "message " + type;
    }


    function showProfileMessage(text, type = "info") {

      profileMessage.textContent = text;

      profileMessage.className =
        "message " + type;
    }


    /* =========================================
       AVATAR
       ========================================= */

    function showAvatar(url, userName = "") {

      if (url) {

        avatar.src = url;

        avatar.classList.remove("hidden");

        avatarPlaceholder.classList.add("hidden");

      } else {

        avatar.src = "";

        avatar.classList.add("hidden");

        avatarPlaceholder.classList.remove("hidden");

        const firstLetter =
          userName
            ? userName.trim().charAt(0).toUpperCase()
            : "?";

        avatarPlaceholder.textContent =
          firstLetter || "?";
      }
    }


    /* =========================================
       LOAD PROFILE
       ========================================= */

    async function loadProfile(user) {

      try {

        const userRef =
          doc(db, "users", user.uid);

        const snapshot =
          await getDoc(userRef);

        if (snapshot.exists()) {

          const data = snapshot.data();

          nickname.value =
            data.nickname || "";

          description.value =
            data.description || "";

          uploadedAvatarUrl =
            data.avatarUrl || "";

          showAvatar(
            uploadedAvatarUrl || user.photoURL,
            data.nickname || user.displayName || ""
          );

        } else {

          nickname.value =
            user.displayName || "";

          description.value =
            "";

          uploadedAvatarUrl =
            "";

          showAvatar(
            user.photoURL || "",
            user.displayName || ""
          );
        }

      } catch (error) {

        console.error(error);

        showProfileMessage(
          "Не удалось загрузить профиль.",
          "error"
        );

        showAvatar(
          user.photoURL || "",
          user.displayName || ""
        );
      }
    }


    /* =========================================
       GOOGLE LOGIN
       ========================================= */

    googleLoginButton.addEventListener(
      "click",
      async () => {

        googleLoginButton.disabled = true;

        showLoginMessage(
          "Открываем Google...",
          "info"
        );

        try {

          await setPersistence(
            auth,
            browserLocalPersistence
          );

          await signInWithPopup(
            auth,
            provider
          );

        } catch (error) {

          console.error(error);

          if (
            error.code ===
            "auth/popup-closed-by-user"
          ) {

            showLoginMessage(
              "Окно входа было закрыто.",
              "error"
            );

          } else if (
            error.code ===
            "auth/popup-blocked"
          ) {

            showLoginMessage(
              "Браузер заблокировал окно Google.",
              "error"
            );

          } else {

            showLoginMessage(
              "Ошибка входа: " +
              (error.message || error.code),
              "error"
            );
          }

        } finally {

          googleLoginButton.disabled = false;
        }
      }
    );


    /* =========================================
       LOGOUT
       ========================================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        logoutButton.disabled = true;

        try {

          await signOut(auth);

        } catch (error) {

          console.error(error);

          showProfileMessage(
            "Не удалось выйти из аккаунта.",
            "error"
          );

          logoutButton.disabled = false;
        }
      }
    );


    /* =========================================
       AVATAR UPLOAD
       ========================================= */

    avatarFile.addEventListener(
      "change",
      async () => {

        const file =
          avatarFile.files[0];

        if (!file) {
          return;
        }

        if (
          !file.type.startsWith("image/")
        ) {

          showProfileMessage(
            "Можно выбрать только изображение.",
            "error"
          );

          avatarFile.value = "";

          return;
        }

        if (
          file.size > 10 * 1024 * 1024
        ) {

          showProfileMessage(
            "Изображение слишком большое. Максимум 10 МБ.",
            "error"
          );

          avatarFile.value = "";

          return;
        }


        showProfileMessage(
          "Загружаем аватар...",
          "info"
        );

        try {

          const formData =
            new FormData();

          formData.append(
            "file",
            file
          );


          const response =
            await fetch(
              "https://picrd.com/api/upload",
              {
                method: "POST",
                body: formData
              }
            );


          if (!response.ok) {
            throw new Error(
              "Ошибка загрузки изображения."
            );
          }


          const result =
            await response.json();

          console.log(
            "Picrd response:",
            result
          );


          const url =
            result.url ||
            result.link ||
            result.image?.url ||
            result.data?.url;


          if (!url) {

            throw new Error(
              "Сервис не вернул ссылку на изображение."
            );
          }


          uploadedAvatarUrl = url;

          showAvatar(
            url,
            nickname.value ||
            currentUser?.displayName ||
            ""
          );


          showProfileMessage(
            "Аватар загружен. Теперь нажми «Сохранить профиль».",
            "success"
          );

        } catch (error) {

          console.error(error);

          showProfileMessage(
            "Не получилось загрузить аватар. Попробуй другое изображение.",
            "error"
          );

        } finally {

          avatarFile.value = "";
        }
      }
    );


    /* =========================================
       SAVE PROFILE
       ========================================= */

    saveButton.addEventListener(
      "click",
      async () => {

        if (!currentUser) {

          showProfileMessage(
            "Сначала войди в аккаунт.",
            "error"
          );

          return;
        }


        const nick =
          nickname.value.trim();

        const about =
          description.value.trim();


        if (nick.length < 2) {

          showProfileMessage(
            "Никнейм должен содержать хотя бы 2 символа.",
            "error"
          );

          nickname.focus();

          return;
        }


        saveButton.disabled = true;

        showProfileMessage(
          "Сохраняем профиль...",
          "info"
        );


        try {

          const userRef =
            doc(
              db,
              "users",
              currentUser.uid
            );


          await setDoc(
            userRef,
            {

              uid:
                currentUser.uid,

              email:
                currentUser.email || "",

              nickname:
                nick,

              description:
                about,

              avatarUrl:
                uploadedAvatarUrl ||
                currentUser.photoURL ||
                "",

              updatedAt:
                Date.now()

            },
            {
              merge: true
            }
          );


          profileName.textContent =
            nick;

          if (uploadedAvatarUrl) {

            showAvatar(
              uploadedAvatarUrl,
              nick
            );

          }


          showProfileMessage(
            "Профиль успешно сохранён.",
            "success"
          );

        } catch (error) {

          console.error(error);

          showProfileMessage(
            "Ошибка сохранения: " +
            (error.message || error.code),
            "error"
          );

        } finally {

          saveButton.disabled = false;
        }
      }
    );


    /* =========================================
       AUTH STATE
       ========================================= */

    onAuthStateChanged(
      auth,
      async (user) => {

        currentUser = user;


        if (user) {

          /* USER LOGGED IN */

          loginSection.classList.add(
            "hidden"
          );

          cabinetSection.classList.remove(
            "hidden"
          );


          profileName.textContent =
            user.displayName ||
            "Пользователь";


          profileEmail.textContent =
            user.email ||
            "";


          showAvatar(
            user.photoURL || "",
            user.displayName || ""
          );


          await loadProfile(user);


        } else {

          /* USER LOGGED OUT */

          loginSection.classList.remove(
            "hidden"
          );

          cabinetSection.classList.add(
            "hidden"
          );

          currentUser = null;

          nickname.value = "";

          description.value = "";

          uploadedAvatarUrl = "";

        }
      }
    );

  </script>

</body>
</html>
