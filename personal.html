<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Личный кабинет</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

html{
scroll-behavior:smooth
}

body{
background:#f5f5f5;
color:#111;
font:14px Arial,sans-serif;
overflow-x:hidden
}

header{
position:fixed;
z-index:1000;
top:0;
width:100%;
height:74px;
padding:0 42px;
display:flex;
justify-content:space-between;
align-items:center;
background:#f5f5f5eb;
border-bottom:1px solid #d8d8d8;
backdrop-filter:blur(12px)
}

.logo{
font-size:18px;
font-weight:600
}

nav{
display:flex;
gap:34px
}

nav a{
color:#555;
text-decoration:none
}

nav a:hover{
color:#000
}

main{
min-height:100vh;
padding:140px 7vw 80px
}

.hero{
max-width:1100px
}

h1{
font-size:clamp(50px,8vw,120px);
line-height:.9;
letter-spacing:-6px;
font-weight:500;
margin-bottom:50px
}

.subtitle{
font-size:18px;
color:#666;
max-width:600px;
line-height:1.6;
margin-bottom:35px
}

.button{
display:inline-flex;
align-items:center;
justify-content:center;
padding:16px 24px;
background:#111;
color:#fff;
border:none;
text-decoration:none;
font-size:14px;
cursor:pointer;
transition:.2s
}

.button:hover{
background:#333
}

.button:disabled{
opacity:.5;
cursor:not-allowed
}

.card{
display:none;
max-width:650px;
margin-top:30px;
padding:30px;
background:#fff;
border:1px solid #ddd
}

.card.active{
display:block
}

.profile-form{
display:flex;
flex-direction:column;
gap:20px
}

.field{
display:flex;
flex-direction:column;
gap:8px
}

.field label{
font-size:13px;
color:#555
}

.field input,
.field textarea{
width:100%;
padding:14px;
font:14px Arial,sans-serif;
border:1px solid #ccc;
background:#fff;
color:#111;
outline:none
}

.field input:focus,
.field textarea:focus{
border-color:#111
}

.field textarea{
min-height:130px;
resize:vertical
}

.user{
display:flex;
align-items:center;
gap:18px;
margin-bottom:30px
}

.avatar{
width:64px;
height:64px;
border-radius:50%;
object-fit:cover;
background:#ddd
}

.user-name{
font-size:20px;
font-weight:600
}

.user-email{
margin-top:5px;
color:#777
}

.save-button{
margin-top:5px
}

.message{
display:none;
margin-top:20px;
padding:15px;
border:1px solid #ccc;
background:#fafafa;
color:#555
}

.error{
display:none;
margin-top:20px;
padding:15px;
background:#fff0f0;
border:1px solid #ffb5b5;
color:#b00000
}

.logout{
margin-top:15px;
background:#fff;
color:#111;
border:1px solid #ccc
}

.logout:hover{
background:#eee
}

@media(max-width:800px){

header{
padding:0 20px
}

nav{
gap:15px
}

main{
padding:120px 20px 60px
}

h1{
letter-spacing:-4px
}

}

@media(max-width:420px){

header{
height:65px
}

.logo{
font-size:16px
}

nav a{
font-size:12px
}

main{
padding-top:110px
}

}

</style>
</head>

<body>

<header>

<div class="logo">
Физические Номера
</div>

<nav>
<a href="index.html">На главную</a>
</nav>

</header>


<main>

<section class="hero">

<h1>
Личный<br>
кабинет
</h1>

<p class="subtitle" id="description">
У вас пока нет личного кабинета.
Создать его можно через Google.
</p>

<button class="button" id="loginButton">
Создать кабинет
</button>


<div class="card" id="accountCard">

<div class="user">

<img
class="avatar"
id="avatar"
src=""
alt="Аватар"
>

<div>

<div class="user-name" id="googleName">
Пользователь
</div>

<div class="user-email" id="userEmail">
</div>

</div>

</div>


<div class="profile-form">


<div class="field">

<label for="avatarFile">
Аватар
</label>

<input
type="file"
id="avatarFile"
accept="image/png,image/jpeg,image/webp,image/gif"
>

</div>


<div class="field">

<label for="nickname">
Никнейм
</label>

<input
type="text"
id="nickname"
maxlength="30"
placeholder="Введите никнейм"
>

</div>


<div class="field">

<label for="profileDescription">
Описание профиля
</label>

<textarea
id="profileDescription"
maxlength="300"
placeholder="Расскажите немного о себе"
></textarea>

</div>


<button
class="button save-button"
id="saveButton"
>
Сохранить профиль
</button>

<button
class="button logout"
id="logoutButton"
>
Выйти из аккаунта
</button>

</div>


<div
class="message"
id="successMessage"
>
Профиль сохранён.
</div>

</div>


<div
class="error"
id="errorBox"
></div>

</section>

</main>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyBqGLonGIt2m_55dt1DWjzhLGn7m6N0J4",

authDomain: "physical-numbers.firebaseapp.com",

projectId: "physical-numbers",

storageBucket: "physical-numbers.firebasestorage.app",

messagingSenderId: "1031207446971",

appId: "1:1031207446971:web:ed03e122d4727f8e28fc9e",

measurementId: "G-S8J83CEQWL"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


const loginButton =
document.getElementById("loginButton");

const description =
document.getElementById("description");

const accountCard =
document.getElementById("accountCard");

const googleName =
document.getElementById("googleName");

const userEmail =
document.getElementById("userEmail");

const avatar =
document.getElementById("avatar");

const avatarFile =
document.getElementById("avatarFile");

const nickname =
document.getElementById("nickname");

const profileDescription =
document.getElementById("profileDescription");

const saveButton =
document.getElementById("saveButton");

const logoutButton =
document.getElementById("logoutButton");

const successMessage =
document.getElementById("successMessage");

const errorBox =
document.getElementById("errorBox");


function showError(message){

errorBox.textContent = message;

errorBox.style.display = "block";

}


function hideError(){

errorBox.style.display = "none";

}


function showSuccess(message){

successMessage.textContent = message;

successMessage.style.display = "block";

}


function hideSuccess(){

successMessage.style.display = "none";

}


/*
Проверяем сохранение входа.
Теперь Google-вход должен сохраняться
между перезагрузками страницы.
*/

try{

await setPersistence(
auth,
browserLocalPersistence
);

}
catch(error){

console.error(error);

}


/*
Google-вход
*/

loginButton.addEventListener("click", async () => {

hideError();

hideSuccess();

loginButton.disabled = true;

loginButton.textContent = "Подключение...";


try{

await signInWithPopup(auth,provider);

}
catch(error){

console.error(error);

if(error.code === "auth/popup-closed-by-user"){

showError(
"Окно входа было закрыто."
);

}
else if(error.code === "auth/popup-blocked"){

showError(
"Браузер заблокировал окно Google."
);

}
else{

showError(
"Не удалось войти через Google. Код ошибки: " +
error.code
);

}

loginButton.disabled = false;

loginButton.textContent = "Создать кабинет";

}

});


/*
Загрузка существующего профиля
*/

async function loadProfile(user){

try{

const userRef =
doc(db,"users",user.uid);

const userSnapshot =
await getDoc(userRef);


if(userSnapshot.exists()){

const data =
userSnapshot.data();

nickname.value =
data.nickname || "";

profileDescription.value =
data.description || "";


/*
Если в Firestore уже есть
аватарка — показываем её.
*/

if(data.avatarUrl){

avatar.src =
data.avatarUrl;

}

}

}
catch(error){

console.error(error);

showError(
"Не удалось загрузить профиль. Код ошибки: " +
error.code
);

}

}


/*
Загрузка аватарки в Picrd
*/

async function uploadAvatar(file){

if(!file){

return null;

}


/*
Максимум 10 МБ
*/

if(file.size > 10 * 1024 * 1024){

throw new Error(
"Размер аватарки не должен превышать 10 МБ."
);

}


/*
Проверяем тип файла
*/

const allowedTypes = [

"image/png",
"image/jpeg",
"image/webp",
"image/gif"

];

if(!allowedTypes.includes(file.type)){

throw new Error(
"Можно загружать только PNG, JPEG, WebP или GIF."
);

}


const formData =
new FormData();

formData.append(
"file",
file
);

formData.append(
"visibility",
"public"
);


/*
Без ttl_seconds =
без установленного срока удаления.
*/

const response =
await fetch(
"https://picrd.com/api/upload",
{
method:"POST",
body:formData
}
);


if(!response.ok){

throw new Error(
"Picrd вернул ошибку HTTP " +
response.status
);

}


const result =
await response.json();


if(!result.image_url){

throw new Error(
"Picrd не вернул ссылку на изображение."
);

}


return result.image_url;

}


/*
Предпросмотр выбранной аватарки
*/

avatarFile.addEventListener(
"change",
() => {

const file =
avatarFile.files[0];

if(!file){

return;

}


const previewUrl =
URL.createObjectURL(file);

avatar.src =
previewUrl;

}
);


/*
Сохранение профиля
*/

saveButton.addEventListener("click", async () => {

const user =
auth.currentUser;


if(!user){

showError(
"Сначала войдите через Google."
);

return;

}


hideError();

hideSuccess();


const nicknameValue =
nickname.value.trim();

const descriptionValue =
profileDescription.value.trim();


if(!nicknameValue){

showError(
"Введите никнейм."
);

return;

}


saveButton.disabled = true;

saveButton.textContent =
"Сохранение...";


try{

let avatarUrl = null;


/*
Если пользователь выбрал
новую аватарку — загружаем её.
*/

if(avatarFile.files.length > 0){

saveButton.textContent =
"Загрузка аватарки...";

avatarUrl =
await uploadAvatar(
avatarFile.files[0]
);

}


/*
Сохраняем данные в Firestore.
*/

saveButton.textContent =
"Сохранение...";


const userRef =
doc(db,"users",user.uid);


const profileData = {

nickname: nicknameValue,

description: descriptionValue,

email: user.email || "",

googleName: user.displayName || "",

updatedAt:
new Date().toISOString()

};


/*
Записываем avatarUrl
только если пользователь
выбрал новую картинку.
*/

if(avatarUrl){

profileData.avatarUrl =
avatarUrl;

}


await setDoc(
userRef,
profileData,
{
merge:true
}
);


showSuccess(
"Профиль сохранён."
);


/*
После загрузки очищаем
выбранный файл.
*/

avatarFile.value = "";

}
catch(error){

console.error(error);

showError(
error.message ||
"Не удалось сохранить профиль."
);

}


saveButton.disabled = false;

saveButton.textContent =
"Сохранить профиль";

});


/*
Выход
*/

logoutButton.addEventListener("click", async () => {

try{

await signOut(auth);

}
catch(error){

console.error(error);

showError(
"Не удалось выйти из аккаунта."
);

}

});


/*
Отслеживаем состояние аккаунта
*/

onAuthStateChanged(
auth,
async (user) => {

hideError();

hideSuccess();


if(user){

description.textContent =
"Настройте информацию своего профиля.";

loginButton.style.display =
"none";

accountCard.classList.add("active");


googleName.textContent =
user.displayName ||
"Пользователь";

userEmail.textContent =
user.email || "";


/*
Пока у пользователя нет
нашей аватарки, показываем
Google-аватар.
*/

if(user.photoURL){

avatar.src =
user.photoURL;

}
else{

avatar.src = "";

}


await loadProfile(user);

}
else{

description.textContent =
"У вас пока нет личного кабинета. Создать его можно через Google.";

loginButton.style.display =
"inline-flex";

accountCard.classList.remove("active");

nickname.value = "";

profileDescription.value = "";

avatarFile.value = "";

avatar.src = "";

}

});

</script>

</body>
</html>
