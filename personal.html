<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Личный кабинет — Физические Номера</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top left, #24134d 0%, transparent 35%),
        radial-gradient(circle at bottom right, #40152c 0%, transparent 35%),
        #0b0b10;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: #fff;
    }

    .back-btn,
    .logout-btn,
    .google-btn,
    .save-btn,
    .upload-btn {
      border: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .back-btn {
      padding: 11px 16px;
      border-radius: 12px;
      background: #191922;
      color: #fff;
      text-decoration: none;
      display: inline-block;
    }

    .back-btn:hover {
      background: #252531;
      transform: translateY(-1px);
    }

    .login-card,
    .profile-card {
      background: rgba(18, 18, 25, 0.94);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .login-card {
      max-width: 520px;
      margin: 70px auto;
      padding: 35px;
      text-align: center;
    }

    .login-card h1 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .login-card p {
      color: #a8a8b4;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .google-btn {
      width: 100%;
      padding: 15px;
      border-radius: 13px;
      background: #fff;
      color: #111;
      font-weight: 700;
      font-size: 16px;
    }

    .google-btn:hover {
      background: #e9e9e9;
      transform: translateY(-1px);
    }

    .google-btn:disabled,
    .save-btn:disabled,
    .upload-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .profile-card {
      overflow: hidden;
    }

    .profile-header {
      padding: 30px;
      background:
        linear-gradient(
          135deg,
          rgba(111, 67, 255, 0.20),
          rgba(255, 43, 43, 0.10)
        );
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .profile-header-inner {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .avatar {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      object-fit: cover;
      background: #25252f;
      border: 3px solid rgba(255,255,255,0.15);
      display: block;
    }

    .avatar-placeholder {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: linear-gradient(135deg, #272735, #15151d);
      border: 3px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 800;
      color: #aaa;
    }

    .profile-main-info {
      min-width: 0;
    }

    .profile-main-info h1 {
      font-size: 28px;
      margin-bottom: 7px;
      word-break: break-word;
    }

    .email {
      color: #a8a8b4;
      word-break: break-word;
    }

    .content {
      padding: 30px;
    }

    .section {
      margin-bottom: 30px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      color: #b7b7c2;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid #2c2c38;
      background: #101017;
      color: #fff;
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
      transition: 0.2s ease;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #6e49ff;
      box-shadow: 0 0 0 3px rgba(110,73,255,0.12);
    }

    .field textarea {
      min-height: 120px;
      resize: vertical;
    }

    .readonly {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .avatar-upload-box {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 18px;
      border-radius: 15px;
      background: #111119;
      border: 1px solid #252531;
    }

    .upload-info {
      flex: 1;
      min-width: 220px;
    }

    .upload-info strong {
      display: block;
      margin-bottom: 5px;
    }

    .upload-info span {
      color: #858592;
      font-size: 13px;
      line-height: 1.4;
    }

    .upload-btn {
      padding: 12px 16px;
      border-radius: 11px;
      background: #292936;
      color: #fff;
      font-weight: 600;
    }

    .upload-btn:hover {
      background: #363644;
    }

    #avatarInput {
      display: none;
    }

    .save-area {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      padding-top: 5px;
    }

    .save-btn {
      padding: 13px 22px;
      border-radius: 12px;
      background: #6e49ff;
      color: #fff;
      font-weight: 700;
    }

    .save-btn:hover {
      background: #7b5aff;
      transform: translateY(-1px);
    }

    .logout-btn {
      padding: 13px 20px;
      border-radius: 12px;
      background: #2a1b20;
      color: #ff8e9c;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: #392128;
    }

    .status {
      min-height: 20px;
      font-size: 14px;
      color: #aaa;
    }

    .status.success {
      color: #67d995;
    }

    .status.error {
      color: #ff7272;
    }

    .status.loading {
      color: #b4a8ff;
    }

    .hidden {
      display: none !important;
    }

    .loading-screen {
      text-align: center;
      padding: 80px 20px;
      color: #aaa;
    }

    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 15px;
      border: 3px solid #2b2b35;
      border-top-color: #6e49ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 650px) {
      .page {
        padding: 18px 12px;
      }

      .topbar {
        align-items: flex-start;
      }

      .logo {
        font-size: 20px;
      }

      .profile-header,
      .content {
        padding: 20px;
      }

      .profile-header-inner {
        flex-direction: column;
        text-align: center;
      }

      .profile-main-info h1 {
        font-size: 23px;
      }

      .avatar,
      .avatar-placeholder {
        width: 100px;
        height: 100px;
      }

      .login-card {
        margin: 35px auto;
        padding: 25px 20px;
      }

      .save-area {
        flex-direction: column;
        align-items: stretch;
      }

      .save-btn,
      .logout-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="page">
  <div class="container">

    <div class="topbar">
      <div class="logo">Физические Номера</div>

      <a href="index.html" class="back-btn">
        На главную
      </a>
    </div>

    <!-- Загрузка -->
    <div id="loadingScreen" class="loading-screen">
      <div class="spinner"></div>
      Проверяем авторизацию...
    </div>

    <!-- Не авторизован -->
    <div id="loginCard" class="login-card hidden">
      <h1>Личный кабинет</h1>

      <p>
        Войди через Google, чтобы сохранять профиль,
        описание и аватар.
      </p>

      <button id="googleLoginBtn" class="google-btn" type="button">
        Войти через Google
      </button>

      <div id="loginStatus" class="status"></div>
    </div>

    <!-- Профиль -->
    <div id="profileCard" class="profile-card hidden">

      <div class="profile-header">
        <div class="profile-header-inner">

          <div class="avatar-wrapper">
            <img
              id="avatarPreview"
              class="avatar hidden"
              alt="Аватар профиля"
            >

            <div
              id="avatarPlaceholder"
              class="avatar-placeholder"
            >
              ?
            </div>
          </div>

          <div class="profile-main-info">
            <h1 id="profileTitle">
              Мой профиль
            </h1>

            <div id="profileEmail" class="email">
              Загрузка...
            </div>
          </div>

        </div>
      </div>

      <div class="content">

        <!-- Аватар -->
        <div class="section">

          <div class="section-title">
            Аватар
          </div>

          <div class="avatar-upload-box">

            <div class="upload-info">
              <strong>Фотография профиля</strong>

              <span>
                JPG, JPEG, PNG, WebP или GIF.
                Максимальный размер — 10 МБ.
              </span>
            </div>

            <input
              id="avatarInput"
              type="file"
              accept="image/png,image/jpeg,image/webp,image/gif"
            >

            <button
              id="chooseAvatarBtn"
              class="upload-btn"
              type="button"
            >
              Выбрать фото
            </button>

          </div>

          <div
            id="avatarStatus"
            class="status"
            style="margin-top: 10px;"
          ></div>

        </div>

        <!-- Основные данные -->
        <div class="section">

          <div class="section-title">
            Информация
          </div>

          <div class="field">
            <label for="nickname">
              Никнейм
            </label>

            <input
              id="nickname"
              type="text"
              maxlength="40"
              placeholder="Например: nikto242"
            >
          </div>

          <div class="field">
            <label for="description">
              О себе
            </label>

            <textarea
              id="description"
              maxlength="500"
              placeholder="Расскажи немного о себе..."
            ></textarea>
          </div>

          <div class="field">
            <label for="email">
              Email Google
            </label>

            <input
              id="email"
              class="readonly"
              type="text"
              readonly
            >
          </div>

        </div>

        <!-- Сохранение -->
        <div class="section">

          <div class="save-area">

            <button
              id="saveBtn"
              class="save-btn"
              type="button"
            >
              Сохранить профиль
            </button>

            <button
              id="logoutBtn"
              class="logout-btn"
              type="button"
            >
              Выйти
            </button>

            <div
              id="saveStatus"
              class="status"
            ></div>

          </div>

        </div>

      </div>
    </div>

  </div>
</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
  }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
  }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  /*
    ============================================================
    FIREBASE CONFIG
    ============================================================

    ВАЖНО:

    Вставь сюда свой настоящий apiKey из Firebase.

    Остальные значения оставь своими, если они уже правильные.
  */

  const firebaseConfig = {
    apiKey: "AIzaSyBqGLonGIt2m_55dt1DWjzhLGnL7m6N0J4",
    authDomain: "physical-numbers.firebaseapp.com",
    projectId: "physical-numbers",
    storageBucket: "physical-numbers.firebasestorage.app",
    messagingSenderId: "1031207446971",
    appId: "1:1031207446971:web:ed03e122d4727f8e28fc9e",
    measurementId: "G-S8J83CEQWL"
  };


  /*
    ============================================================
    FIREBASE
    ============================================================
  */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);

  const provider = new GoogleAuthProvider();


  /*
    ============================================================
    ЭЛЕМЕНТЫ
    ============================================================
  */

  const loadingScreen =
    document.getElementById("loadingScreen");

  const loginCard =
    document.getElementById("loginCard");

  const profileCard =
    document.getElementById("profileCard");

  const googleLoginBtn =
    document.getElementById("googleLoginBtn");

  const loginStatus =
    document.getElementById("loginStatus");

  const profileTitle =
    document.getElementById("profileTitle");

  const profileEmail =
    document.getElementById("profileEmail");

  const nicknameInput =
    document.getElementById("nickname");

  const descriptionInput =
    document.getElementById("description");

  const emailInput =
    document.getElementById("email");

  const avatarInput =
    document.getElementById("avatarInput");

  const chooseAvatarBtn =
    document.getElementById("chooseAvatarBtn");

  const avatarPreview =
    document.getElementById("avatarPreview");

  const avatarPlaceholder =
    document.getElementById("avatarPlaceholder");

  const avatarStatus =
    document.getElementById("avatarStatus");

  const saveBtn =
    document.getElementById("saveBtn");

  const saveStatus =
    document.getElementById("saveStatus");

  const logoutBtn =
    document.getElementById("logoutBtn");


  /*
    ============================================================
    СОСТОЯНИЕ
    ============================================================
  */

  let currentUser = null;

  let currentAvatarUrl = "";

  let selectedAvatarFile = null;


  /*
    ============================================================
    ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    ============================================================
  */

  function setStatus(element, text, type = "") {

    element.textContent = text;

    element.className = "status";

    if (type) {
      element.classList.add(type);
    }
  }


  function getInitials(user) {

    const name =
      user?.displayName ||
      user?.email ||
      "?";

    const words =
      name
        .trim()
        .split(/\s+/)
        .filter(Boolean);

    if (words.length >= 2) {

      return (
        words[0][0] +
        words[1][0]
      ).toUpperCase();

    }

    return name
      .slice(0, 2)
      .toUpperCase();
  }


  function showAvatar(url, user = currentUser) {

    if (url) {

      avatarPreview.src = url;

      avatarPreview.classList.remove("hidden");

      avatarPlaceholder.classList.add("hidden");

      return;
    }

    avatarPreview.removeAttribute("src");

    avatarPreview.classList.add("hidden");

    avatarPlaceholder.textContent =
      getInitials(user);

    avatarPlaceholder.classList.remove("hidden");
  }


  function isValidImage(file) {

    if (!file) {
      return false;
    }

    const allowedTypes = [
      "image/png",
      "image/jpeg",
      "image/webp",
      "image/gif"
    ];

    return allowedTypes.includes(file.type);
  }


  /*
    ============================================================
    FIREBASE AUTH PERSISTENCE
    ============================================================

    Сессия сохраняется локально.
  */

  try {

    await setPersistence(
      auth,
      browserLocalPersistence
    );

  } catch (error) {

    console.error(
      "Не удалось установить persistence:",
      error
    );

  }


  /*
    ============================================================
    GOOGLE LOGIN
    ============================================================
  */

  googleLoginBtn.addEventListener(
    "click",
    async () => {

      googleLoginBtn.disabled = true;

      setStatus(
        loginStatus,
        "Открываем Google...",
        "loading"
      );

      try {

        await signInWithPopup(
          auth,
          provider
        );

        setStatus(
          loginStatus,
          "Вход выполнен.",
          "success"
        );

      } catch (error) {

        console.error(
          "Ошибка Google входа:",
          error
        );

        let message =
          "Не удалось войти через Google.";

        if (
          error.code ===
          "auth/popup-closed-by-user"
        ) {

          message =
            "Окно Google было закрыто.";

        } else if (
          error.code ===
          "auth/popup-blocked"
        ) {

          message =
            "Браузер заблокировал окно Google.";

        } else if (
          error.code ===
          "auth/unauthorized-domain"
        ) {

          message =
            "Этот домен не добавлен в Firebase Authentication.";

        } else if (
          error.code ===
          "auth/operation-not-allowed"
        ) {

          message =
            "В Firebase не включён вход через Google.";

        } else if (
          error.code ===
          "auth/network-request-failed"
        ) {

          message =
            "Проблема с интернет-соединением.";

        }

        setStatus(
          loginStatus,
          message,
          "error"
        );

      } finally {

        googleLoginBtn.disabled = false;

      }

    }
  );


  /*
    ============================================================
    AVATAR — ВЫБОР ФАЙЛА
    ============================================================
  */

  chooseAvatarBtn.addEventListener(
    "click",
    () => {

      avatarInput.click();

    }
  );


  avatarInput.addEventListener(
    "change",
    () => {

      const file =
        avatarInput.files?.[0];

      if (!file) {
        return;
      }


      if (!isValidImage(file)) {

        setStatus(
          avatarStatus,
          "Можно загрузить только JPG, PNG, WebP или GIF.",
          "error"
        );

        avatarInput.value = "";

        return;
      }


      if (file.size > 10 * 1024 * 1024) {

        setStatus(
          avatarStatus,
          "Файл слишком большой. Максимум — 10 МБ.",
          "error"
        );

        avatarInput.value = "";

        return;
      }


      selectedAvatarFile = file;


      const localUrl =
        URL.createObjectURL(file);

      showAvatar(
        localUrl,
        currentUser
      );


      setStatus(
        avatarStatus,
        "Фото выбрано. Нажми «Сохранить профиль».",
        "loading"
      );

    }
  );


  /*
    ============================================================
    PICRD UPLOAD
    ============================================================

    Firebase Storage НЕ используется.

    Если Picrd разрешает запросы с GitHub Pages,
    изображение загрузится и вернётся URL.

    Если браузер пишет "Failed to fetch",
    это может быть CORS/сетевое ограничение самого Picrd.
  */

  async function uploadAvatarToPicrd(file) {

    const formData =
      new FormData();

    formData.append(
      "file",
      file
    );


    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        () => controller.abort(),
        30000
      );


    try {

      const response =
        await fetch(
          "https://picrd.com/api/upload",
          {
            method: "POST",
            body: formData,
            signal: controller.signal
          }
        );


      if (!response.ok) {

        throw new Error(
          `Picrd HTTP ${response.status}`
        );

      }


      const data =
        await response.json();


      console.log(
        "Ответ Picrd:",
        data
      );


      /*
        Пытаемся найти URL изображения
        в разных возможных вариантах ответа.
      */

      const url =
        data?.url ||
        data?.image?.url ||
        data?.data?.url ||
        data?.result?.url ||
        data?.link ||
        data?.image_url;


      if (!url) {

        throw new Error(
          "Picrd не вернул URL изображения."
        );

      }


      return url;

    } finally {

      clearTimeout(timeout);

    }

  }


  /*
    ============================================================
    ЗАГРУЗКА / СОХРАНЕНИЕ ПРОФИЛЯ
    ============================================================
  */

  async function loadProfile(user) {

    const profileRef =
      doc(
        db,
        "users",
        user.uid
      );


    try {

      const snapshot =
        await getDoc(profileRef);


      if (snapshot.exists()) {

        const data =
          snapshot.data();


        nicknameInput.value =
          data.nickname || "";


        descriptionInput.value =
          data.description || "";


        currentAvatarUrl =
          data.avatarUrl || "";


        if (currentAvatarUrl) {

          showAvatar(
            currentAvatarUrl,
            user
          );

        } else {

          showAvatar(
            user.photoURL || "",
            user
          );

        }

      } else {

        nicknameInput.value =
          user.displayName || "";


        descriptionInput.value =
          "";


        currentAvatarUrl =
          user.photoURL || "";


        showAvatar(
          currentAvatarUrl,
          user
        );

      }

    } catch (error) {

      console.error(
        "Ошибка загрузки профиля:",
        error
      );

      setStatus(
        saveStatus,
        "Не удалось загрузить данные профиля.",
        "error"
      );

    }

  }


  /*
    ============================================================
    SAVE PROFILE
    ============================================================
  */

  saveBtn.addEventListener(
    "click",
    async () => {

      if (!currentUser) {

        setStatus(
          saveStatus,
          "Сначала войди через Google.",
          "error"
        );

        return;
      }


      saveBtn.disabled = true;

      setStatus(
        saveStatus,
        "Сохраняем профиль...",
        "loading"
      );


      try {

        /*
          Если выбрали новое фото —
          сначала пытаемся загрузить его.
        */

        if (selectedAvatarFile) {

          setStatus(
            avatarStatus,
            "Загружаем аватар...",
            "loading"
          );


          try {

            const uploadedUrl =
              await uploadAvatarToPicrd(
                selectedAvatarFile
              );


            currentAvatarUrl =
              uploadedUrl;


            showAvatar(
              currentAvatarUrl,
              currentUser
            );


            setStatus(
              avatarStatus,
              "Аватар загружен.",
              "success"
            );


            selectedAvatarFile = null;

            avatarInput.value = "";

          } catch (avatarError) {

            console.error(
              "Ошибка загрузки аватара:",
              avatarError
            );


            let avatarMessage =
              "Аватар не загрузился.";


            if (
              avatarError?.name ===
              "AbortError"
            ) {

              avatarMessage =
                "Picrd слишком долго не отвечал.";

            } else if (
              avatarError?.message
                ?.toLowerCase()
                .includes("failed to fetch")
            ) {

              avatarMessage =
                "Браузер не смог обратиться к Picrd. Это может быть ограничение CORS.";

            } else {

              avatarMessage =
                "Аватар не загрузился: " +
                avatarError.message;

            }


            setStatus(
              avatarStatus,
              avatarMessage,
              "error"
            );


            /*
              ВАЖНО:
              профиль всё равно может сохраниться.
              Старый avatarUrl не затираем.
            */

            selectedAvatarFile = null;

            avatarInput.value = "";

          }

        }


        /*
          Сохраняем Firestore.
        */

        const profileRef =
          doc(
            db,
            "users",
            currentUser.uid
          );


        await setDoc(
          profileRef,
          {
            nickname:
              nicknameInput.value.trim(),

            description:
              descriptionInput.value.trim(),

            email:
              currentUser.email || "",

            googleName:
              currentUser.displayName || "",

            avatarUrl:
              currentAvatarUrl || "",

            updatedAt:
              serverTimestamp()
          },
          {
            merge: true
          }
        );


        profileTitle.textContent =
          nicknameInput.value.trim() ||
          currentUser.displayName ||
          "Мой профиль";


        setStatus(
          saveStatus,
          "Профиль сохранён.",
          "success"
        );


      } catch (error) {

        console.error(
          "Ошибка сохранения:",
          error
        );


        setStatus(
          saveStatus,
          "Не удалось сохранить профиль: " +
          error.message,
          "error"
        );

      } finally {

        saveBtn.disabled = false;

      }

    }
  );


  /*
    ============================================================
    LOGOUT
    ============================================================
  */

  logoutBtn.addEventListener(
    "click",
    async () => {

      logoutBtn.disabled = true;

      try {

        await signOut(auth);

      } catch (error) {

        console.error(
          "Ошибка выхода:",
          error
        );

        logoutBtn.disabled = false;

      }

    }
  );


  /*
    ============================================================
    AUTH STATE
    ============================================================
  */

  onAuthStateChanged(
    auth,
    async (user) => {

      loadingScreen.classList.add(
        "hidden"
      );


      if (!user) {

        currentUser = null;

        profileCard.classList.add(
          "hidden"
        );

        loginCard.classList.remove(
          "hidden"
        );

        return;
      }


      /*
        Пользователь авторизован.
      */

      currentUser = user;


      loginCard.classList.add(
        "hidden"
      );

      profileCard.classList.remove(
        "hidden"
      );


      profileEmail.textContent =
        user.email || "Email не указан";


      emailInput.value =
        user.email || "";


      profileTitle.textContent =
        user.displayName ||
        "Мой профиль";


      showAvatar(
        user.photoURL || "",
        user
      );


      await loadProfile(user);

    }
  );

</script>

</body>
</html>
